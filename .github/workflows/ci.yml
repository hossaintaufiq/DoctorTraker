name: Doctor Tracker CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Lint, Typecheck, Test, Build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: ./backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck & Compile TypeScript
        run: npm run build

      - name: Run Vitest Integration & Security Tests
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: supersecretjwtkeyforbackendtesting123456789
          JWT_REFRESH_SECRET: supersecretjwtrefreshkeyfortesting987654321
          CORS_ORIGIN: http://localhost:3000
          MONGODB_URI: mongodb://127.0.0.1:27017/test_doctor_tracker
          ALLOW_DB_RESET: "false"

  frontend:
    name: Frontend (Lint, Typecheck, Test, Build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Run ESLint
        run: npm run lint

      - name: Run Vitest Unit Tests
        run: npm test

      - name: Build Next.js Production Bundle
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:5000/api
